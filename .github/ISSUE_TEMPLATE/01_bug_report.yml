name: Bug Report
description: "Found a bug? Please search through our open issues first, to make sure it isn't already submitted."
labels: ["bug"]
body:
  - type: checkboxes
    attributes:
      label: "Pre-submit Checks"
      options:
        - label: "I have [searched Clinch issues](https://github.com/elliot-ylambda/clinch-terminal/issues) and there are no duplicates"
          required: true
        - label: "This reproduces in Clinch (if it also reproduces in official Warp, consider filing [upstream](https://github.com/warpdotdev/warp/issues) too)"
          required: false
  - type: textarea
    id: "describe-the-bug"
    attributes:
      label: "Describe the bug"
      description: "A clear and concise description of what the bug is."
      placeholder: Tell us what you see.
    validations:
      required: true
  - type: textarea
    id: "to-reproduce"
    attributes:
      label: "To reproduce"
      description: "Bug reports with clear reproduction will get prioritized higher and addressed more quickly."
      placeholder: "Steps to reproduce: 1. Go to '...' 2. Click on '...' 3. Scroll down to '...' 4. See error '...'"
    validations:
      required: true
  - type: textarea
    id: "expected-behavior"
    attributes:
      label: "Expected behavior"
      description: "A clear and concise description of what you expected to happen."
      placeholder: Tell us what you expect to see.
    validations:
      required: false
  - type: textarea
    id: "screenshots-logs"
    attributes:
      label: "Screenshots, videos, and logs"
      description: "If applicable, add screenshots/videos/logs to help us understand your problem. While optional, these help expedite the time in which your bug is addressed."
    validations:
      required: false
  - type: input
    id: "os-version"
    attributes:
      label: "macOS version"
      description: "For example: macOS 15.5. Clinch is macOS-only."
    validations:
      required: true
  - type: input
    id: "local-shell-version"
    attributes:
      label: "Shell Version"
      description: "For example, `bash 4.0` e.g. Run `bash --version` or `zsh --version`"
    validations:
      required: false
  - type: input
    id: "clinch-version"
    attributes:
      label: "Current Clinch version"
      description: "Open Settings (CMD-,), go to the About page, and click the copy icon next to the version number. For example: `v0.2026.07.08.1540`"
    validations:
      required: false
  - type: dropdown
    id: "regression"
    attributes:
      label: "Regression"
      description: "Is this a regression (used to work in a previous Clinch version)?"
      multiple: false
      options:
        - "No, this bug or issue has existed throughout my experience using Clinch"
        - "Yes, this bug started recently or with a specific Clinch version"
    validations:
      required: true
  - type: input
    id: "clinch-version-regression"
    attributes:
      label: "Most recent working Clinch version"
      description: "The last Clinch version (or date) that worked as expected"
    validations:
      required: false
  - type: textarea
    id: "additional-context"
    attributes:
      label: "Additional context"
      description: "Add any other context about the problem here."
    validations:
      required: false
  - type: dropdown
    id: "blocker"
    attributes:
      label: "Does this block you from using Clinch daily?"
      description: "All feedback will be reviewed, even if you select 'No'."
      multiple: false
      options:
        - "No"
        - "Yes, this issue prevents me from using Clinch daily."
    validations:
      required: true
  - type: dropdown
    id: "terminals"
    attributes:
      label: "Is this an issue only in Clinch?"
      description: "Verifying this issue doesn't happen in other terminals helps us to prioritize the fix"
      multiple: false
      options:
        - "Yes, I confirmed that this only happens in Clinch, not other terminals."
        - "No, this issue happens in Clinch and other terminals."
    validations:
      required: true
