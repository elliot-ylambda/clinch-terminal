<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Deployed behind a Tailscale Serve path mount, every asset below uses a relative URL.
      // A slash-less MOUNT ROOT resolves them against the domain root, outside the mount, and
      // the page loads blank — self-correct that case before any asset is requested. Sub-routes
      // like /pair must NOT be redirected: their relative assets already resolve to the mount
      // root, and appending a slash would break them. The mount prefix is fixed by
      // PairingRegistry::route_path in app/src/remote_control/pairing.rs.
      if (/\/clinch-remote-[^/]+$/.test(location.pathname)) {
        location.replace(location.pathname + "/" + location.search + location.hash);
      }
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#050712" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Clinch" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/clinch-256.png" />
    <link rel="apple-touch-icon" href="./icons/clinch-256.png" />
    <title>Clinch Remote Control</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
